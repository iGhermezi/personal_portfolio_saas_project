          readOnly: true
      required:
      - edu
      - id
      - portfolio
    EmailChangeConfirm:
      type: object
      properties:
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
    EmailChangeRequest:
      type: object
      properties:
        new_email:
          type: string
          format: email
      required:
      - new_email
    EmailLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    EmailVerificationResend:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Experience:
