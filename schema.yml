components:
  schemas:
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - current_password
      - new_password
    Education:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        edu:
          type: string
          maxLength: 100
        portfolio:
